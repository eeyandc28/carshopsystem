<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Viewport & Mobile Display -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Carshop Management and Service Management System" />
    
    <!-- Theme & Colors -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="background-color" content="#0f172a" />
    
    <!-- iOS / Apple Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RADI8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>RADI8 - Precision. Reliability. Service.</title>

    <style>
      /* Standalone Shell Loading Preloader */
      body {
        margin: 0;
        background-color: #020617;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
        z-index: 99999;
      }
      .splash-icon {
        width: 72px;
        height: 72px;
        background: #2563eb;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.4);
        margin-bottom: 20px;
        animation: pulseLogo 2s ease-in-out infinite;
      }
      .splash-icon svg {
        width: 40px;
        height: 40px;
        color: #ffffff;
      }
      .splash-title {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 8px;
      }
      .splash-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 255, 255, 0.15);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 14px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img src="/logo.png" alt="RADI8" style="max-height: 80px; width: auto; object-fit: contain; margin-bottom: 16px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);" />
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
