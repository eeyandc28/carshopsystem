<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#334155" stroke-width="2" />
  <!-- RADI8 Motif -->
  <!-- Red dot above I -->
  <circle cx="84" cy="28" r="9" fill="#dc2626" />
  <!-- Letters RAD -->
  <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#f8fafc" letter-spacing="-1">RAD</text>
  <!-- Slanted I -->
  <path d="M 80 43 L 89 43 L 86 82 L 77 82 Z" fill="#f8fafc" />
  <!-- Red 8 -->
  <text x="92" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#dc2626">8</text>
  <!-- Tagline bar -->
  <rect x="18" y="96" width="92" height="4" rx="2" fill="#dc2626" opacity="0.8" />
</svg>